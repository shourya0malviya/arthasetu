{% extends 'base.html' %}
{% block title %}Register — ArthaSetu{% endblock %}

{% block content %}
<div class="auth-page d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="auth-card">
                    <div class="auth-header text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h3 class="auth-title">Join ArthaSetu</h3>
                        <p class="auth-sub">Create your free account in seconds</p>
                    </div>

                    <!-- Role Toggle -->
                    <div class="role-toggle-group mb-4" id="roleToggle">
                        <button type="button" class="role-btn active" onclick="setRole('client', this)">
                            <i class="bi bi-person-fill me-2"></i>I'm a Client
                            <small class="d-block mt-1">I need work done</small>
                        </button>
                        <button type="button" class="role-btn" onclick="setRole('worker', this)">
                            <i class="bi bi-tools me-2"></i>I'm a Worker
                            <small class="d-block mt-1">I offer services</small>
                        </button>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}" novalidate id="registerForm">
                        <input type="hidden" name="role" id="roleInput" value="client">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label as-label">Full Name *</label>
                                <div class="input-group as-input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="name" class="form-control as-input"
                                           placeholder="Ramesh Kumar" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label as-label">Phone Number</label>
                                <div class="input-group as-input-group">
                                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                                    <input type="tel" name="phone" class="form-control as-input"
                                           placeholder="9876543210">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label as-label">Email Address *</label>
                                <div class="input-group as-input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" name="email" class="form-control as-input"
                                           placeholder="you@example.com" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label as-label">Password *</label>
                                <div class="input-group as-input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control as-input"
                                           placeholder="Min. 6 characters" required minlength="6">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label as-label">Confirm Password *</label>
                                <div class="input-group as-input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" id="confirmPw" class="form-control as-input"
                                           placeholder="Repeat password" required>
                                </div>
                            </div>
                        </div>

                        <!-- Worker info note -->
                        <div class="worker-info-box mt-3" id="workerNote" style="display:none">
                            <i class="bi bi-info-circle-fill text-warning me-2"></i>
                            After registration, complete your skill profile from your dashboard to start receiving job matches.
                        </div>

                        <button type="submit" class="btn btn-as-orange w-100 btn-lg mt-4"
                                onclick="return validateForm()">
                            <i class="bi bi-rocket-takeoff me-2"></i>Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted">Already registered? </span>
                        <a href="{{ url_for('login') }}" class="auth-link">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setRole(role, btn) {
    document.getElementById('roleInput').value = role;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('workerNote').style.display = role === 'worker' ? 'block' : 'none';
}

function validateForm() {
    const pw  = document.querySelector('input[name="password"]').value;
    const cpw = document.getElementById('confirmPw').value;
    if (pw !== cpw) {
        alert('Passwords do not match!');
        return false;
    }
    return true;
}
</script>
{% endblock %}

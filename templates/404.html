{% extends 'base.html' %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center"
     style="min-height:70vh; padding:3rem 1rem;">
    <div style="font-size:6rem; line-height:1; color:var(--orange); font-family:'Syne',sans-serif; font-weight:800; opacity:0.3;">
        404
    </div>
    <h2 class="mt-3">Page Not Found</h2>
    <p class="text-muted mt-2" style="max-width:380px;">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="d-flex gap-3 mt-4">
        <a href="{{ url_for('home') }}" class="btn btn-as-orange">
            <i class="bi bi-house me-2"></i>Go Home
        </a>
        <a href="{{ url_for('browse_workers') }}" class="btn btn-outline-light">
            Browse Workers
        </a>
    </div>
</div>
{% endblock %}
